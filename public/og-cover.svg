<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4E5B"/>
      <stop offset="100%" style="stop-color:#052C35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9EE014"/>
      <stop offset="100%" style="stop-color:#F0711D"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#9EE014" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="#F0711D" opacity="0.05"/>
  
  <!-- Robot icon -->
  <g transform="translate(550, 180)">
    <rect x="25" y="60" width="100" height="80" rx="12" fill="#334155" stroke="#9EE014" stroke-width="2"/>
    <rect x="35" y="10" width="80" height="50" rx="10" fill="#334155" stroke="#9EE014" stroke-width="2"/>
    <circle cx="55" cy="35" r="8" fill="#9EE014"/>
    <circle cx="105" cy="35" r="8" fill="#F0711D"/>
    <circle cx="58" cy="32" r="3" fill="white" opacity="0.8"/>
    <circle cx="108" cy="32" r="3" fill="white" opacity="0.8"/>
    <line x1="75" y1="10" x2="75" y2="0" stroke="#9EE014" stroke-width="2"/>
    <circle cx="75" cy="0" r="4" fill="#9EE014"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="bold" fill="white">
    MercurBot
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8">
    AI-Powered PDF Intelligence
  </text>
  
  <!-- Tagline -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748B">
    Ask questions. Get answers. Cite pages.
  </text>
  
  <!-- Feature pills -->
  <g transform="translate(300, 480)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="#9EE014" opacity="0.15"/>
    <text x="60" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9EE014">RAG Search</text>
    
    <rect x="140" y="0" width="120" height="32" rx="16" fill="#F0711D" opacity="0.15"/>
    <text x="200" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F0711D">Page Citations</text>
    
    <rect x="280" y="0" width="120" height="32" rx="16" fill="#9EE014" opacity="0.15"/>
    <text x="340" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9EE014">Charts</text>
    
    <rect x="420" y="0" width="120" height="32" rx="16" fill="#E5E6E1" opacity="0.15"/>
    <text x="480" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#E5E6E1">Bilingual</text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">
    copixi.vercel.app
  </text>
</svg>